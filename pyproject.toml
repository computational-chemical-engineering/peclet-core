# Python packaging for peclet-core's Python surface: the Lagrangian halo (`peclet.core.mpi`) and the
# analytic-SDF geometry (`peclet.core.geom`). core itself is a header-only C++20 library; these are
# the nanobind modules under python/ (scikit-build-core points at that subdirectory). The `version`
# below is THE version source: CMakeLists.txt reads it. (The AMR octree, `peclet.core.amr` until
# 2026-09-10, is the separate peclet-amr package: `peclet.amr`.)
#
# `pip install .` builds them via scikit-build-core:
#   * peclet.core.mpi needs MPI (and mpi4py at runtime); peclet.core.geom needs nothing else.
#
#   pip install .
#
# This mirrors the developer flow documented in python/CMakeLists.txt; nanobind is added automatically
# as a build requirement.

[build-system]
requires = ["scikit-build-core>=0.8", "nanobind>=2.0"]
build-backend = "scikit_build_core.build"

[project]
name = "peclet-halo"
version = "1.1.0"
description = "peclet.halo — the distributed Lagrangian particle halo: ORB block decomposition, migration and ghosts over MPI"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "E.A.J.F. Peters", email = "e.a.j.f.peters@tue.nl" }]
# The wheels are manylinux x86-64 and there is no Windows or macOS build (suite docs/DEPLOYMENT.md,
# "Operating system"); say so on the PyPI page, where a reader looks before pip tells them.
keywords = ["domain decomposition", "MPI", "halo exchange", "ghost cells", "signed distance field", "SDF", "load balancing", "Kokkos", "HPC"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Education",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Mathematics",
]

dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/computational-chemical-engineering/peclet"
Documentation = "https://computational-chemical-engineering.github.io/peclet/"
Source = "https://github.com/computational-chemical-engineering/peclet-core"
"Examples gallery" = "https://computational-chemical-engineering.github.io/peclet-examples/"
Issues = "https://github.com/computational-chemical-engineering/peclet-core/issues"
Changelog = "https://github.com/computational-chemical-engineering/peclet-core/blob/main/CHANGELOG.md"

[tool.scikit-build]
minimum-version = "0.8"
cmake.version = ">=3.24"
# The Python modules live in python/ (a standalone find_package project); the SKBUILD-guarded install
# rules there install mpi + geom into peclet/core/.
cmake.source-dir = "python"
wheel.install-dir = "."
# Everything shipped in the wheel is placed by the CMake install() rules (compiled modules + the
# peclet/core/__init__.py); disable scikit-build-core's package auto-discovery so it doesn't also try.
wheel.packages = []
# SuiteNanobind.cmake is the umbrella's (../../cmake) in a suite checkout and the vendored copy in cmake/
# in a standalone sdist, so `pip install peclet-core` builds without the suite (it did not from 0.1.0
# through 0.6.0 -- the `peclet[mpi]` extra was unusable).
sdist.include = ["include", "python", "cmake", "CMakeLists.txt", "README.md", "LICENSE"]
