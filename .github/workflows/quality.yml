name: Quality

# Code-quality gates. Python hard-fails on critical errors only. The C++ clang-format check is
# BLOCKING (since 2026-09-08, suite/docs/QUALITY_PLAN.md §3.D.7): clang-format is pinned to 18.1.8
# (the suite venv's version, installed from PyPI as morton does — the apt package drifts) and the tree
# is formatted against the suite-wide 62-line .clang-format. include/peclet/core/amr/ is EXCLUDED
# until the AMR branch under active development lands (a reformat there would conflict with it);
# drop the grep -v below at that point.

on:
  push:
    branches: [main, "**"]
  pull_request:
  workflow_dispatch:

jobs:
  python-lint:
    name: ruff (critical errors)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - name: Ruff critical-error check
        run: |
          ruff check . --select E9,F63,F7,F82 \
            --exclude ".venv,venv,build,build_*,__pycache__,_deps,extern,legacy,notebooks"

  cpp-format:
    name: clang-format 18.1.8 (blocking; amr/ excluded until the AMR branch lands)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "clang-format==18.1.8"
      - name: clang-format dry-run (uses the repo .clang-format)
        run: |
          files=$(git ls-files 'include/*.hpp' 'tests/*.hpp' 'tests/*.cpp' 'benchmarks/*.cpp' 'python/*.cpp' \
                  | grep -v '^include/peclet/core/amr/')
          [ -z "$files" ] && { echo "no C++ sources"; exit 0; }
          clang-format --version
          echo "$files" | wc -l
          clang-format --dry-run --Werror $files
