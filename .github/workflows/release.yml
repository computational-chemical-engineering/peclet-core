name: Release

# Publish this repository's two distributions to PyPI on a version tag via Trusted Publishing (OIDC)
# — configure the publisher on PyPI first; no API token secret needed. peclet-halo is SDIST ONLY: its
# Python surface is the MPI particle halo (peclet.halo), which links MPI, whose ABI makes a portable
# binary wheel impossible. Consumers `pip install peclet-halo` (or `peclet[mpi]`) and build against
# their site MPI, or use the suite containers. The peclet-core compatibility shell is pure Python
# (wheel + sdist, job `shell` below). Both upload from ONE tag, so both version literals
# (pyproject.toml and packaging/pyproject-core.toml) must be new. See ../docs/RELEASE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # A PyPI long description is baked into the upload; pypi.org has no "edit README". A stale page
  # noticed after a tag can only be fixed by publishing another version, so this runs BEFORE
  # anything is built and `publish` needs it — the last moment the mistake is still cheap.
  #
  # The checker and its rules live in the UMBRELLA (docs/NAMING.md §2 is the canon), and are used
  # from there rather than vendored, so nine repos cannot drift apart on what a retired spelling is.
  landing-pages:
    name: landing page is not stale
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: computational-chemical-engineering/peclet
          path: .peclet-umbrella
          sparse-checkout: |
            /docs/NAMING.md
            /tools/release/check_landing_pages.py
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: |
          python .peclet-umbrella/tools/release/check_landing_pages.py \
                 --naming .peclet-umbrella/docs/NAMING.md \
                 --page README.md --dists peclet-halo,peclet-core

  sdist:
    name: sdist - peclet-halo
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  # This repository publishes TWO distributions since the boundary split
  # (suite/docs/CORE_BOUNDARY.md): peclet-halo from pyproject.toml above, and the pure-Python
  # peclet-core compatibility SHELL from packaging/pyproject-core.toml, which keeps
  # `import peclet.core.{geom,mpi}` working until 2.0.0. Same `cp packaging/... pyproject.toml`
  # pattern the umbrella uses for peclet-cu13.
  shell:
    name: wheel+sdist - peclet-core (compatibility shell)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build
      - name: Build the shell from packaging/pyproject-core.toml
        run: |
          cp packaging/pyproject-core.toml pyproject.toml
          python -m build          # pure Python: wheel + sdist, no compiler needed
      - uses: actions/upload-artifact@v7
        with:
          name: shell
          path: |
            dist/*.whl
            dist/*.tar.gz

  publish:
    needs: [landing-pages, sdist, shell]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
