name: Release

# Publish peclet-core to PyPI on a version tag via Trusted Publishing (OIDC) — configure the publisher
# on PyPI first; no API token secret needed. SDIST ONLY: peclet-core's Python surface is the MPI particle
# halo (peclet.core.mpi), which links MPI, whose ABI makes a portable binary wheel impossible (the
# Kokkos AMR octree is the peclet-amr package since 2026-09-10). Consumers `pip install peclet-core`
# and build against their site MPI, or use the suite containers. See ../docs/RELEASE.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build --sdist
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    environment: pypi
    permissions:
      id-token: write   # required for trusted publishing
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - uses: pypa/gh-action-pypi-publish@release/v1
